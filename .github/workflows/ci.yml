name: TOMFIC AWS CI

on:
  push:
    branches: [main, aws-migration]
  pull_request:
    branches: [main, aws-migration]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --force --package-lock=false
      - run: npm --workspace @tomfic/web install --force --package-lock=false
      - run: npm run build:web
      - run: npm run test:offline

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tomfic
          POSTGRES_PASSWORD: tomfic_test
          POSTGRES_DB: tomfic_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U tomfic -d tomfic_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://tomfic:tomfic_test@localhost:5433/tomfic_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --force --package-lock=false
      - run: npm run build:api
      - run: npx --workspace @tomfic/api prisma migrate deploy
      - run: npm run test:api
      - run: npm run test:db

  infrastructure:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build API dist for CDK
        run: |
          cd ..
          npm install --force --package-lock=false
          cd apps/api
          npx prisma generate
          npx tsc
          mkdir -p dist/prisma
          cp prisma/schema.prisma dist/prisma/
          cp -r prisma/migrations dist/prisma/
          cd ../../infra
      - run: npx cdk synth
